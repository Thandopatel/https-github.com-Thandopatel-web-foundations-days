<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes - Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Fast, minimal note-taking for busy minds.</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Features</h2>
      <ul class="features">
        <li>Fast capture</li>
        <li>Offline friendly</li>
        <li>Simple search</li>
        <li>Dark mode</li>
      </ul>
    </section>

    <section>
      <h2>Comparison</h2>
      <table>
        <thead>
          <tr>
            <th>Feature</th>
            <th>QuickNotes</th>
            <th>Others</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Speed</td>
            <td>Instant</td>
            <td>Slow</td>
          </tr>
          <tr>
            <td>Offline</td>
            <td>Yes</td>
            <td>No</td>
          </tr>
          <tr>
            <td>Price</td>
            <td>Free</td>
            <td>Subscription</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section>
      <h2>Feedback</h2>
      <form id="feedback-form">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name" />

        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Your feedback"></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 QuickNotes. All rights reserved.</p>
  </footer>
</body>
</html>
